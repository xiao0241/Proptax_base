[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "property-tax-base-mini"
version = "0.1.0"
description = "Mini ETL for official county-level property tax valuation panels for California and Florida."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
  "openpyxl>=3.0",
  "xlrd>=2.0",
  "pydantic>=2.0",
  "pypdf>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
