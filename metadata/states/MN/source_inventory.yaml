    value_unit_in_source: nominal dollars
    unit_conversion_applied: none
    notes: "MN timing: ASSESSMENT YEAR 2002 (valuation date Jan 2, 2002) determines taxes payable 2003, so the payable-2003 bulletin is the assessment-2002 volume — matching the calendar-2002 valuation convention of the other states. Printed statewide values: total net tax capacity 3,744,896,051; total taxable value 3,300,357,274; taxable market value (real & personal) 325,199,309,058. Bulletin county-name spellings Ottertail/Watowan/Wilken are aliased to Otter Tail/Watonwan/Wilkin. Known source bug (avoided): ptbulletin_03 Table 26 Part C's column headed 2002 actually contains payable-2001 figures — never source payable-year values from that table. Minor internal discrepancy in the source: Table 28 Part B statewide total differs from the bulletin's Chart 1 figure (325,205,340,827) by $6.03M (~0.002%, likely manufactured homes); the Table 28 Part B county detail is used as-is."
