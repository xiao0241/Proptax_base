    extraction_method: "pdftotext -layout parse. Table 32 (PDF pp. 188-190): column 1 Total Net Tax Capacity Value and column 5 Total Taxable Value per county; Table 28 Part B (pp. 101-103): Real & Personal taxable market value total. Printed Statewide rows used as statewide-sum QA gates (0.5% tolerance; all three reconcile exactly). sha256 pinned in the extractor."
