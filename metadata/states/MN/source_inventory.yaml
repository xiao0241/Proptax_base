    notes: "Kept to document the payable-year vs assessment-year convention (its payable-2002 Table 32 statewide total NTC is 3,408,514,473, the assessment-2001 base). Cross-check for the panel values: the payable-2004 bulletin (ptbulletin_04.pdf, same URL pattern) Table 26 Part C reprints the payable-2003 county total net tax capacity figures exactly (verified for Aitkin, Anoka, Hennepin, and the statewide total)."
