    sha256: "56088a08a07bf7b6fc2db6081d31f91e383529f4d3693d055c9f8605c05e88ed (table10_03) ; d19bb349019aeb6c4ce67b1067eda30457ed6fc19eb608e8f42bce962dbe2ab6 (table4_03)"
    value_unit_in_source: "thousands of dollars (table10_03) ; millions of dollars (table4_03)"
    unit_conversion_applied: none
    notes: "Table 4 of the FY 2002-03 report shows the revised 2002-03 statewide net value (2,756,001 million USD vs 2,755,772 million USD as first published, +0.008 percent), confirming the published Table 10 figures within tolerance."
