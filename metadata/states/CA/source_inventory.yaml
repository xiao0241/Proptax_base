    value_unit_in_source: thousands of dollars
    unit_conversion_applied: "multiplied by 1,000 to nominal dollars (also noted in reports/validation_summary.md extractor notes)"
    notes: "The 2002-03 assessment roll (lien date Jan 1, 2002) is published in the FY 2001-02 Annual Report (table files suffixed _02); the FY 2002-03 report contains the 2003-04 roll. Net of 'all other' exemptions; includes homeowners' exemption value (footnote a) - the base the 1% rate applies to. Live boe.ca.gov archive starts at FY 2015-16, so the file was retrieved from the Wayback Machine. Printed statewide Totals: $2,755,772,185 thousand."
  - source_id: ca_boe_annual_report_cross_checks_2002
