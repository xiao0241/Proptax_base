    source_type: official_annual_report_pdf
    source_granularity: county_aggregate
    years_attempted: "2002"
    extraction_method: "pdftotext -layout parse of the one-page Table 10 PDF; column 6 (total assessed value) per county; Totals row used as the statewide-sum QA gate (0.5% tolerance); sha256 pinned in the extractor."
