state: WI
sources:
  - source_id: wi_dor_tvc_2002_equalized_values
    source_agency: Wisconsin Department of Revenue
    source_title: "Town, Village and City Taxes 2002 (TVC bulletin) — state full value of general property, assessment year 2002, county TOTAL rows"
    source_url: "http://web.archive.org/web/20050315064933id_/http://www.dor.state.wi.us/pubs/slf/tvc02.pdf"
    original_url: "http://www.dor.state.wi.us/pubs/slf/tvc02.pdf"
    source_type: official_annual_report_pdf
    source_granularity: county_aggregate
    years_attempted: "2002"
    extraction_method: "pdftotext -layout parse of the 72 'TOTAL <NAME> COUNTY' rows: column 2 = 2002 Full Value (equalized value, TID-in), column 4 = 2002 Full Value Excluding TIF (TID-out). TOTAL STATE row used as the statewide-sum QA gate for both columns (0.5% tolerance); sha256 pinned in the extractor."
    manual_download_required: false
    local_path: data/raw/WI/2002/tvc02.pdf
    sha256: "576e006e0b076f0bf490f801e0ea2a3e62bac611935827519a27db672092ae79"
    bytes: 608171
    value_unit_in_source: nominal dollars
    unit_conversion_applied: none
    notes: "County TOTAL rows are official county aggregates printed in the bulletin (not aggregated by this pipeline). Valuation date January 1, 2002; equalized values certified August 15, 2002. Printed statewide totals: TID-in $335,326,478,700; TID-out $327,322,310,980 (a school-apportionment page prints 327,322,310,987, a 7-dollar rounding artifact). The live revenue.wi.gov site hosts no 2002 files; recovered from the Wayback Machine with the original filename."
  - source_id: wi_dor_news_release_2002_cross_check
    source_agency: Wisconsin Department of Revenue
    source_title: "DOR news release, Aug 15, 2002 — 'State Equalized Values Up 7.3%' (class table, county rankings with all 72 counties' 2001/2002 equalized values, 1959-2002 history)"
    source_url: "http://web.archive.org/web/20020823214828id_/http://www.dor.state.wi.us/news/020815pr.html"
    source_type: official_agency_news_release
    source_granularity: county_aggregate
