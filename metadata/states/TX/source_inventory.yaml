    notes: "Independent appraisal-district (CAD) Total Value per county — the same 254 counties on the appraisal-roll basis rather than the county-taxing-unit basis (e.g. Anderson CAD Total Value 2,327,479,753 vs county Total Values 2,267,874,301). Order-of-magnitude/second-source confirmation of the Appendix C county appraised values."
